
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var redirect =
          window.location.pathname +
          window.location.search +
          window.location.hash;

        sessionStorage.setItem(
          'virtual-tour-redirect',
          redirect
        );

        window.location.replace('/virtual-tour/');
      })();
    </script>
  </head>
  <body>
    Redirecting to Virtual Tour...
  </body>
</html>
